# Draws a snake eating your contribution graph, in blue.
# It runs once a day, whenever you change the README, and whenever you press "Run workflow".
name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight (UTC)
  workflow_dispatch:       # adds the "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write          # lets it save the snake images to your repo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#70a5fd&color_dots=#ebedf0,#d6e6ff,#a8c8ff,#70a5fd,#3d6fd9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#70a5fd&color_dots=#161b22,#1b2b4d,#24427a,#3d6fd9,#70a5fd

      - name: Save the images to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
